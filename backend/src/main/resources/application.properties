server.port=8084

spring.application.name=tp14-banque-soap-ksoap

spring.datasource.url=jdbc:h2:mem:tp14db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
